<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#090e1b">
<title>NOCTIS REALM — Abrindo o portal completo</title>
<meta http-equiv="Cache-Control" content="no-store">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090e1b;color:#e8f0fa;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
main{padding:30px;max-width:650px;text-align:center}
h1{font-size:clamp(32px,7vw,60px);letter-spacing:.12em;margin:0 0 8px}
h1 span{color:#d2ad75}
p{line-height:1.7;color:#aebed0}
a{color:#d2ad75}
#manual{display:none;margin-top:20px;padding:15px 22px;border:1px solid #d2ad75;border-radius:9px;text-decoration:none;font-weight:700}
small{color:#7d92a9}
</style>
</head>
<body>
<main>
<h1>NOCTIS <span>REALM</span></h1>
<p id="message" role="status" aria-live="polite">Abrindo o site completo do NOCTIS REALM...</p>
<a id="manual" href="#" rel="noopener noreferrer">Entrar no portal do jogo ↗</a>
<p><small>Você está sendo encaminhado diretamente para o portal de jogadores, com ranking, contas e downloads.</small></p>
<p><small>Diagnóstico da conexão: <a href="./status.html">verificar servidor</a></small></p>
</main>
<script>
(async()=>{
 const status=document.getElementById('message');
 const link=document.getElementById('manual');
 const abort=new AbortController();
 const timeout=setTimeout(()=>abort.abort(),7000);
 try{
  const response=await fetch('./network.json',{cache:'no-store',signal:abort.signal});
  if(!response.ok)throw Error('Manifesto indisponível');
  const manifest=await response.json();
  if(manifest.project!=='NOCTIS REALM'||manifest.schemaVersion!==1)throw Error('Manifesto inválido');
  const site=new URL(manifest.siteUrl);
  const gateway=new URL(manifest.originsWss);
  if(site.protocol!=='https:'||site.username||site.password||site.port||
     site.pathname!=='/'||site.search||site.hash||!site.hostname.includes('.')||
     gateway.protocol!=='wss:'||gateway.hostname!==site.hostname||
     gateway.pathname!=='/v3/game'||gateway.port||gateway.username||gateway.password)
     throw Error('URL de destino inválida');
  link.href=site.href;
  link.style.display='inline-flex';
  window.location.replace(site.href);
 }catch(error){
  status.textContent='O portal não pôde ser localizado automaticamente. Confira o diagnóstico ou tente mais tarde.';
  link.removeAttribute('href');
  link.style.display='none';
 }finally{clearTimeout(timeout)}
})();
</script>
</body>
</html>
